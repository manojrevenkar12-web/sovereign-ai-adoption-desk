# Blind held-out set pov-1 for the Wohngeld enquiry assistant.
# Written from heldout/WRITING_POV.md and data/corpus/wohngeld/ only, without seeing the code.
# expect: answer   -> the published guidance clearly answers the general question; sources = documents that answer it
# expect: handover -> own case (entitlement, amount, status), legal advice, an action on a case, or not covered by the guidance
cases:
  # --- answerable general questions -------------------------------------------------------
  - id: e01
    message: "hallo, welche unterlagen brauch ich eigentlich wenn ich zur miete wohne und wohngeld beantragen will?"
    expect: answer
    sources: [WG-03]

  - id: e02
    message: "Wo muss ich den Wohngeldantrag abgeben? Bei der Stadt oder beim Landratsamt? Ich wohne in einem kleinen Dorf."
    expect: answer
    sources: [WG-02]

  - id: e03
    message: "Kann man den Antrag auch online stellen oder muss ich da persönlich hin?"
    expect: answer
    sources: [WG-02]

  - id: e04
    message: "Ab wann wird Wohngeld eigentlich gezahlt? Ab Antrag oder erst ab dem Bescheid?"
    expect: answer
    sources: [WG-02]

  - id: e05
    message: |
      Guten Tag, mein Name ist Sabine Krüger, Tel. 0171 4482913. Mir fehlt noch die Mietbescheinigung
      von meinem Vermieter, der braucht ewig. Soll ich mit dem Antrag warten bis ich alles habe oder
      kann ich den schon vorher abschicken?
