      3. Werden im Ministerium Fachverfahren auf Softwareständen betrieben, für die keine Sicherheitsupdates mehr erscheinen?
      4. Bis wann soll die Modernisierung des Förderverfahrens abgeschlossen sein?
      5. Wie hoch sind die Gesamtkosten der Modernisierung des Förderverfahrens?
