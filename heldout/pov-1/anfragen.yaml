# Blind held-out set pov-1 for the Kleine Anfrage drafting assistant.
# Written from heldout/WRITING_POV.md and data/corpus/ministerium/ only, without seeing the code.
# Classified (vs_nfd): MV-07 (Sicherheitsvorfälle 2026), MV-11 (Bewertung Bürger-Chatbot).
# answered  -> an internal record answers it; sources = records that answer it (any one is enough)
# withheld  -> only vs_nfd records answer it
# no_record -> no record answers it
anfragen:
  - id: a01
    text: |
      Kleine Anfrage der Abgeordneten Dr. Miriam Hollstein (Fraktion BÜNDNIS 90/DIE GRÜNEN)
      betreffend KI-Pilotprojekte in der Staatsverwaltung

      Ich frage die Landesregierung:
      1. Wie viele KI-Pilotprojekte laufen derzeit in der Staatsverwaltung, und auf wie viele Ressorts verteilen sie sich?
      2. Wie viele dieser Pilotprojekte werden bereits mit echten Nutzerinnen und Nutzern erprobt?
      3. Welche Haushaltsmittel stehen 2026 für die Pilotprojekte zur Verfügung, und wie viel davon war bis Ende September 2026 gebunden?
      4. Wurden im Jahr 2026 Pilotprojekte beendet, und wenn ja, aus welchen Gründen?
      5. Welche Haushaltsmittel sind für die KI-Pilotprojekte im Haushaltsjahr 2027 vorgesehen?
      6. Welche Ressorts sind an den Pilotprojekten beteiligt (bitte namentlich aufführen)?
    expect:
      1: {status: answered, sources: [MV-01]}
      2: {status: answered, sources: [MV-01]}
      3: {status: answered, sources: [MV-01]}
      4: {status: answered, sources: [MV-01]}
      5: {status: no_record}
      6: {status: no_record}

  - id: a02
    text: |
      Kleine Anfrage des Abgeordneten Florian Brandt (Fraktion der FDP)
      betreffend Einführung eines KI-Assistenten im Ministerium

      Ich frage die Landesregierung:
      1. Seit wann und für wie viele Beschäftigte steht im Ministerium ein KI-Assistent zur Verfügung?
      2. Wie viele Beschäftigte nutzen den KI-Assistenten regelmäßig?
      3. Welche Ausgaben sind für den KI-Assistenten im Haushaltsjahr 2026 veranschlagt, und wie verteilen sie sich auf Lizenzen und Schulung?
      4. Auf welchem Weg wurde der KI-Assistent beschafft?
      5. Von welchem Hersteller stammt das dem KI-Assistenten zugrunde liegende Sprachmodell?
      6. Wie viele Arbeitsstunden wurden durch den Einsatz des KI-Assistenten bislang eingespart?
    expect:
      1: {status: answered, sources: [MV-02]}
      2: {status: answered, sources: [MV-02]}
      3: {status: answered, sources: [MV-05]}
      4: {status: answered, sources: [MV-05]}
      5: {status: no_record}
      6: {status: no_record}

  - id: a03
    text: |
      Kleine Anfrage der Abgeordneten Petra Lindqvist (Fraktion der SPD)
      betreffend Datenschutz und Beschäftigtenrechte beim Einsatz von KI im Ministerium

      Ich frage die Landesregierung:
      1. Wo werden die Eingaben in den KI-Assistenten gespeichert, und werden sie zum Training von Modellen verwendet?
      2. Wurde für den KI-Assistenten eine Datenschutz-Folgenabschätzung durchgeführt?
      3. Welche Daten dürfen nach der Nutzungsrichtlinie nicht in den KI-Assistenten eingegeben werden?
      4. Wird die Nutzung des KI-Assistenten je Person ausgewertet oder zur Leistungs- oder Verhaltenskontrolle verwendet?
      5. Wann und zwischen wem wurde die Dienstvereinbarung KI geschlossen?
      6. Wie viele Datenschutzbeschwerden im Zusammenhang mit dem KI-Assistenten sind seit seiner Einführung eingegangen?
    expect:
      1: {status: answered, sources: [MV-04]}
      2: {status: answered, sources: [MV-04]}
      3: {status: answered, sources: [MV-04]}
      4: {status: answered, sources: [MV-02, MV-03]}
      5: {status: answered, sources: [MV-03]}
      6: {status: no_record}

