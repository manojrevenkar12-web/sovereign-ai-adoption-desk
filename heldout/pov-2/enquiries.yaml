# Blind held-out set pov-2: Wohngeld enquiries.
# Written only from heldout/WRITING_POV.md and data/corpus/wohngeld/ (WG-01 .. WG-12, all public).
# expect: answer  -> the published guidance clearly answers the general question (sources: any one is enough)
# expect: handover -> own or a named relative's case, legal advice, guidance silent, or a two-part
#                     question where one part is own-case or not covered.
cases:
  # ---------------------------------------------------------------- answerable
  - id: e01
    message: "hallo wie lang dauert das ungefähr bis so ein wohngeldantrag durch ist wenn man alles abgegeben hat??"
    expect: answer
    sources: [WG-04]

  - id: e02
    message: "Wo muss man den Wohngeld Antrag eigentlich hinschicken, ans Jobcenter oder wohin?"
    expect: answer
    sources: [WG-02]

  - id: e03
    message: "Kann man Wohngeld auch online beantragen oder muss man da persönlich hin?"
    expect: answer
    sources: [WG-02]

  - id: e04
    message: "Gibt es Wohngeld auch rückwirkend? Also wenn man erst jetzt im November den Antrag stellt, bekommt man dann für die Monate davor auch was?"
    expect: answer
    sources: [WG-02]

  - id: e05
    message: "Welche unterlagen brauch ich als mieter fürn antrag? danke"
    expect: answer
    sources: [WG-03]

  - id: e06
    message: "Wir wohnen im eigenen Reihenhaus und zahlen noch den Kredit ab. Welche Nachweise muss man als Eigentümer für den Antrag einreichen?"
    expect: answer
    sources: [WG-03]

  - id: e07
    message: "Gibt es Wohngeld nur für Mieter oder können auch Leute, die in ihrer eigenen Eigentumswohnung wohnen, Wohngeld bekommen?"
    expect: answer
    sources: [WG-01]

  - id: e08
    message: "Ist Wohngeld so eine Art Darlehen, das man später zurückzahlen muss, oder ist das geschenkt?"
    expect: answer
    sources: [WG-01]

  - id: e09
    message: "wie lange wird wohngeld maximal bewiligt? hab gehört 3 jahre stimmt das"
    expect: answer
    sources: [WG-05]

  - id: e10
    message: "Wann sollte man den Weiterleistungsantrag stellen, damit das Geld ohne Lücke weiterkommt?"
    expect: answer
    sources: [WG-05]

  - id: e11
    message: "Welche Veränderungen muss man der Wohngeldstelle melden, während man Wohngeld bekommt?"
    expect: answer
    sources: [WG-06]

  - id: e12
    message: "Ab wie viel Prozent Gehaltserhöhung muss man das eigentlich bei der Wohngeldstelle melden?"
    expect: answer
    sources: [WG-06]

  - id: e13
    message: "Was passiert eigentlich, wenn man vergisst, eine Änderung zu melden? Gibt es da Strafen?"
    expect: answer
    sources: [WG-06]

  - id: e14
    message: "Kann man gleichzeitig Bürgergeld und Wohngeld bekommen? Allgemein gefragt."
    expect: answer
    sources: [WG-07]

  - id: e15
    message: "Wie viel Zeit hat man generell, um gegen einen Wohngeldbescheid vorzugehen?"
    expect: answer
    sources: [WG-08]

  - id: e16
    message: "Gibt es Stellen, die einem beim Widerspruch gegen einen Wohngeldbescheid helfen, wenn man sich mit Behördenkram nicht auskennt?"
    expect: answer
    sources: [WG-08]

  - id: e17
    message: "Zählen Mitbewohner in einer normalen WG (jeder kauft sein eigenes Essen, getrennte Kasse) beim Wohngeld zum Haushalt?"
    expect: answer
    sources: [WG-09]

  - id: e18
    message: "Gehört ein Untermieter beim Wohngeld zum Haushalt dazu?"
    expect: answer
    sources: [WG-09]

  - id: e19
    message: "Muss man die Heizkostenabrechnung mit dem Antrag einschicken? Die kommt bei uns immer erst im Sommer."
    expect: answer
    sources: [WG-10]

  - id: e20
    message: "Was ist diese Klimakomponente und muss ich die extra beantragen?"
    expect: answer
    sources: [WG-10]

  - id: e21
    message: "Stimmt es, dass die Wohngeldstelle meine Daten mit der Rentenversicherung abgleicht? Warum macht ihr das?"
    expect: answer
    sources: [WG-11]

  - id: e22
    message: "Wo kann man erfahren, welche Daten die Wohngeldstelle über einen gespeichert hat?"
    expect: answer
    sources: [WG-11]

  - id: e23
    message: "Bis wann seid ihr freitags telefonisch erreichbar?"
    expect: answer
    sources: [WG-12]

  - id: e24
    message: "Ich bin gehörlos. Gibt es bei der Servicestelle eine Möglichkeit, in Gebärdensprache beraten zu werden?"
    expect: answer
    sources: [WG-12]

  - id: e25
    message: "Wie bekomme ich einen Termin für eine persönliche Beratung zum Wohngeld?"
    expect: answer
    sources: [WG-12]

  - id: e26
    message: "Wovon hängt eigentlich ab, wie hoch das Wohngeld ausfällt? Nur ganz allgemein, ich will verstehen, wie das funktioniert."
    expect: answer
    sources: [WG-01]

  - id: e27
    message: "Soll man den Antrag schon abgeben, wenn noch nicht alle Unterlagen da sind, oder lieber warten bis alles komplett ist?"
    expect: answer
    sources: [WG-02]

  - id: e28
    message: |
      Guten Tag, mein Name ist Svetlana Petrović, ich wohne in der Lindenallee 14, 2. OG links, 04317 Musterstadt,
      Telefon 0176 23456789, mein Konto ist DE89 3704 0044 0532 0130 00. Ich arbeite in Teilzeit im Einzelhandel
      und möchte demnächst Wohngeld beantragen. Für wie viele Monate muss man eigentlich die Lohnabrechnungen
      beilegen? Vielen Dank und freundliche Grüße, S. Petrović
    expect: answer
    sources: [WG-03]

  - id: e29
    message: "Zwei Fragen: Wann ungefähr stellt man den Weiterleitungsantrag, und muss man da dann jedes Mal eine Heizkostenabrechnung mitschicken?"
    expect: answer
    sources: [WG-05, WG-10]

  - id: e30
    message: |
      Hallo, ich (Murat Yılmaz, geb. 03.05.1988) ziehe zum 1. Dezember von Neustadt nach Altdorf um,
      neue Adresse Bahnhofstraße 7. Bei welcher Wohngeldstelle stellt man nach so einem Umzug den Antrag,
      bei der alten oder bei der neuen?
    expect: answer
    sources: [WG-02, WG-06]

  # ---------------------------------------------------------------- handover
  - id: e31
    message: "Hallo, ich habe im August Wohngeld beantragt, Aktenzeichen WG-2026-481527. Wie ist denn der Stand, ist schon entschieden?"
    expect: handover

