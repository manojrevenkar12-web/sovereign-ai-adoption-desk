      3. Ist eine Leistungs- oder Verhaltenskontrolle der Beschäftigten mit Hilfe von Protokolldaten der KI-Werkzeuge zulässig?
      4. Hat der Personalrat der Erprobung des KI-gestützten Entwicklungswerkzeugs für das Förderverfahren ausdrücklich zugestimmt?
