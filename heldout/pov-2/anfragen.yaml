      Landtag, Drucksache 19/5144
      Kleine Anfrage des Abgeordneten Henrik Bausch (Fraktion Bürgerbund) vom 12.10.2026
      betreffend IT-Sicherheit im Ministerium
      Ich frage die Staatsregierung:
      1. Wie viele meldepflichtige IT-Sicherheitsvorfälle wurden im Ministerium im Jahr 2026 bis Ende September registriert?
      2. Welche Systeme waren von diesen Vorfällen betroffen, und über welche Angriffswege erfolgten sie?
      3. Wie viele meldepflichtige Sicherheitsvorfälle wurden im Jahr 2025 registriert?
      4. Trifft es zu, dass das Förderverfahren des Ministeriums auf einer Software-Version läuft, für die keine Sicherheitsupdates mehr erscheinen?
      5. Bis wann soll die Modernisierung des Förderverfahrens abgeschlossen sein?
