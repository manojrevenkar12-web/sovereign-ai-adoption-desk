      Ich frage die Staatsregierung:
      1. Welche Ausgaben sind im Haushaltsjahr 2026 für den KI-Assistenten des Ministeriums veranschlagt?
      2. Wie verteilen sich diese Ausgaben auf Lizenzen einerseits und Schulung und Begleitung andererseits?
      3. Auf welchem Weg wurde der KI-Assistent beschafft?
      4. Welche Ausgaben sind für den KI-Assistenten im Haushaltsjahr 2027 geplant?
      5. Welche Anbieter hat das Ministerium für einen Bürger-Chatbot zu Förderprogrammen bewertet, und welche Preise haben diese angeboten?
