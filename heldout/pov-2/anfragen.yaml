# Blind held-out set pov-2: Kleine Anfragen.
# Written only from heldout/WRITING_POV.md and data/corpus/ministerium/ (MV-01 .. MV-12).
# Classified vs_nfd: MV-07, MV-11. All other records are internal and usable.
# answered  -> a usable record states what is asked (sources)
# withheld  -> only vs_nfd records state it
# no_record -> no record states the specific fact asked for (a related record that lacks it is no_record)
anfragen:
  - id: a01
    text: |
      Landtag, Drucksache 19/5101
      Kleine Anfrage der Abgeordneten Dr. Miriam Hollweg (Fraktion Freie Liste) vom 06.10.2026
      betreffend Stand der KI-Pilotprojekte in der Staatsverwaltung
      Ich frage die Staatsregierung:
      1. Wie viele KI-Pilotprojekte laufen derzeit in der Staatsverwaltung, und in wie vielen Ressorts?
      2. Wie viele dieser Pilotprojekte werden bereits mit echten Nutzerinnen und Nutzern erprobt?
      3. Welche Ressorts sind im Einzelnen beteiligt (bitte namentlich aufführen)?
      4. Welche Haushaltsmittel stehen 2026 für die Pilotprojekte zur Verfügung, und wie viel davon ist bis Ende September gebunden?
      5. Wie viele Pilotprojekte wurden 2026 beendet, und aus welchem Grund?
      6. Wie lauten die Bezeichnungen der beendeten Pilotprojekte, und welche Kosten sind für sie bis zur Beendigung angefallen?
    expect:
      1: {status: answered, sources: [MV-01]}
      2: {status: answered, sources: [MV-01]}
      3: {status: no_record}
      4: {status: answered, sources: [MV-01]}
      5: {status: answered, sources: [MV-01]}
      6: {status: no_record}

  - id: a02
    text: |
      Landtag, Drucksache 19/5117
      Kleine Anfrage des Abgeordneten Tobias Rahn (Fraktion Bürgerbund) vom 08.10.2026
      betreffend Nutzung des KI-Assistenten im Ministerium
      Ich frage die Staatsregierung:
      1. Seit wann steht den Beschäftigten des Ministeriums ein KI-Assistent zur Verfügung, und wie vielen Beschäftigten?
      2. Wie hoch war im September 2026 der Anteil der Beschäftigten, die den Assistenten mindestens wöchentlich genutzt haben?
      3. Wird die Nutzung des Assistenten je Beschäftigter oder Beschäftigtem ausgewertet?
      4. Welche Schulung haben die Beschäftigten vor der Freischaltung erhalten, und in welchem Umfang?
      5. Wie hoch war die wöchentliche Nutzungsquote im Juni 2026?
    expect:
      1: {status: answered, sources: [MV-02]}
      2: {status: answered, sources: [MV-02]}
      3: {status: answered, sources: [MV-02, MV-03]}
      4: {status: answered, sources: [MV-02]}
      5: {status: no_record}

