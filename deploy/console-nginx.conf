server {
  listen 8081;
  root /usr/share/nginx/html;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
  }
  location / {
    try_files $uri /index.html;
  }
}
