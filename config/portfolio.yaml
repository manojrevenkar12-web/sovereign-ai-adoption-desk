# How the desk ranks use cases and what it assumes before a proof of value has measured anything.

planning:
  horizon_weeks: 104
  week_starts: monday
  # OpenAI Deployment Engineering engagements the architect can run at once across the whole portfolio
  deployment_eng_capacity: 2
  # Reviewer capacity when a customer file does not name a role
  default_capacity: 1

stages: [discovery, qualified, evaluating, proof_of_value, production_readiness, production, adopted, not_pursued]

# Priority = value * w_value + speed * w_speed + reuse * w_reuse - risk * w_risk, each scaled 0..1
# across the portfolio. Value is projected hours saved per year times the mission weight.
priority:
  w_value: 0.50
  w_speed: 0.25
  w_reuse: 0.15
  w_risk: 0.10
  risk_points:
    high_risk: 1.0
    derogation: 0.4
    dpia: 0.3
    automated_decision: 0.8
    citizen_facing: 0.2
  mission_weight:
    critical: 1.5
    high: 1.2
    normal: 1.0

# Solution patterns. `time_saved_share` is an ASSUMPTION used only until a proof of value measures
# it; every projection built on it is labelled `projected` in the API, the console and the plan.
patterns:
  enquiry_answering:
    title: Answer enquiries from approved guidance, hand individual cases to a person
    channel: citizen_channel
    time_saved_share: 0.35
    metrics: [right_action, citations_supported, eligibility_statements, pii_to_model]
  drafting_with_sources:
    title: Draft documents from internal records with citations
    channel: agent_workflow
    time_saved_share: 0.40
    metrics: [questions_answered, citations_supported, ceiling_breaches]
  records_summary:
    title: Summarise case files and records
    channel: staff_assistant
    time_saved_share: 0.30
    metrics: [faithfulness, citations_supported]
  form_extraction:
    title: Extract structured data from forms and letters
    channel: api_application
    time_saved_share: 0.50
    metrics: [field_accuracy, abstention]
  translation_plain_language:
    title: Translate and rewrite into plain language (Leichte Sprache)
    channel: staff_assistant
    time_saved_share: 0.45
    metrics: [faithfulness]
  code_modernisation:
    title: Modernise legacy code of a specialist procedure with Codex
    channel: codex
    time_saved_share: 0.30
    metrics: [tests_passing, review_findings]
  knowledge_assistant:
    title: General staff assistant over approved knowledge
    channel: staff_assistant
    time_saved_share: 0.15
    metrics: [adoption, citations_supported]
  eligibility_assessment:
    title: Assess eligibility of individual applicants
    channel: api_application
    time_saved_share: 0.40
    metrics: [decision_accuracy, overturned_on_review]
  case_prioritisation:
    title: Prioritise cases or calls
    channel: api_application
    time_saved_share: 0.20
    metrics: [ranking_quality]
